name: Cursor AI Issue Resolver

on:
  issues:
    types: [opened]

  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: cursor-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Analyze and Resolve Issue
    if: |
      github.repository == 'vivek-nitsan/ns_timeline' &&
      (
        github.event_name == 'issues' ||
        (
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          github.event.comment.user.type != 'Bot' &&
          contains(github.event.issue.labels.*.name, 'needs-information')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # GIT CONFIG
      # =========================================================

      - name: Configure Git
        run: |
          git config user.name "T3Planet AI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # =========================================================
      # INSTALL CURSOR
      # =========================================================

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Verify Cursor CLI
        run: |
          cursor-agent --version

      # =========================================================
      # ISSUE CONTEXT
      # =========================================================

      - name: Collect Issue Context
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api \
            --paginate \
            "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            > /tmp/issue-comments.json

          echo "Issue comments collected."

      # =========================================================
      # STAGE 1 - TRIAGE
      # =========================================================

      - name: Triage Issue
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_COMMENT: ${{ github.event.comment.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/issue_triage/build_triage_prompt.py

          echo "Starting Cursor triage..."

          set +e

          cursor-agent \
            -p \
            --trust \
            --output-format text \
            "$(cat /tmp/triage-prompt.txt)" \
            > /tmp/triage-result.txt 2>&1

          CURSOR_EXIT_CODE=$?

          set -e

          echo "Cursor exit code: ${CURSOR_EXIT_CODE}"

          echo ""
          echo "========== CURSOR TRIAGE =========="
          cat /tmp/triage-result.txt
          echo "===================================="

          if [ ! -s /tmp/triage-result.txt ]; then
            echo "Cursor returned an empty response."
            echo "No Pull Request will be created."
            exit 1
          fi

          bash .github/scripts/issue_triage/detect_result.sh /tmp/triage-result.txt

      # =========================================================
      # COMMENT TRIAGE RESULT
      # =========================================================

      - name: Comment Triage Result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 .github/scripts/issue_triage/format_triage_comment.py

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/issue-comment.md

      # =========================================================
      # HANDLE NEEDS INFORMATION STATE
      # =========================================================

      - name: Add Needs Information Label
        if: env.RESULT == 'NEEDS_INFORMATION'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "Checking needs-information label..."

          if ! gh label list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json name \
            --jq '.[].name' | grep -Fxq "needs-information"; then

            echo "Creating needs-information label..."

            gh label create "needs-information" \
              --repo "${{ github.repository }}" \
              --color "FBCA04" \
              --description "T3Planet AI Bot is waiting for more information"
          else
            echo "needs-information label already exists."
          fi

          echo "Adding needs-information label to issue #${ISSUE_NUMBER}..."

          gh issue edit "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --add-label "needs-information"

          echo "Issue marked as waiting for information."

      # =========================================================
      # REMOVE NEEDS INFORMATION STATE
      # =========================================================

      - name: Remove Needs Information Label
        if: |
          env.RESULT == 'VALID_ISSUE' ||
          env.RESULT == 'NOT_AN_ISSUE' ||
          env.RESULT == 'REVIEW_REQUIRED'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "Removing needs-information label if present..."

          gh issue edit "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --remove-label "needs-information" || true

          echo "Needs-information state removed."

      # =========================================================
      # RESET TRIAGE CHANGES
      # =========================================================

      - name: Reset Triage Changes
        if: env.RESULT == 'VALID_ISSUE'
        run: |
          echo "Resetting any accidental changes made during triage..."

          git reset --hard HEAD
          git clean -fd

          echo "Workspace reset successfully."

      # =========================================================
      # STOP - NOT AN ISSUE
      # =========================================================

      - name: Stop - Not an Issue
        if: env.RESULT == 'NOT_AN_ISSUE'
        run: |
          echo "This is not a software issue."
          echo "Explanation has been added to the Issue."
          echo "No branch or Pull Request will be created."

      # =========================================================
      # STOP - NEEDS INFORMATION
      # =========================================================

      - name: Stop - Needs Information
        if: env.RESULT == 'NEEDS_INFORMATION'
        run: |
          echo "More information is required."
          echo "Issue is now marked with needs-information."
          echo "Waiting for a user comment."

      # =========================================================
      # STOP - REVIEW REQUIRED
      # =========================================================

      - name: Stop - Manual Review Required
        if: env.RESULT == 'REVIEW_REQUIRED'
        run: |
          echo "Cursor classification could not be determined."
          echo "No code changes or Pull Request will be created."

      # =========================================================
      # EXISTING BRANCH / PR
      # =========================================================

      - name: Check Existing Pull Request
        if: env.RESULT == 'VALID_ISSUE'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="ai/fix-issue-${ISSUE_NUMBER}"

          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

          EXISTING_PR=$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --head "${BRANCH_NAME}" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )

          if [ -n "$EXISTING_PR" ]; then
            echo "Open pull request already exists for ${BRANCH_NAME}."
            echo "PR_ALREADY_EXISTS=true" >> "$GITHUB_ENV"
            echo "PR_URL=${EXISTING_PR}" >> "$GITHUB_ENV"
            echo "PR_URL=${EXISTING_PR}"
          else
            echo "No open pull request found for ${BRANCH_NAME}."
            echo "PR_ALREADY_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Comment Existing Pull Request
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat > /tmp/existing-pr-comment.md <<EOF
          ## 🤖 T3Planet AI Bot

          ### 🔍 Issue Analysis

          **Classification:** ✅ \`VALID_ISSUE\`

          ### 🚀 Draft Pull Request

          A draft Pull Request already exists for this issue:

          ${PR_URL}

          No new branch or Pull Request was created.
          EOF

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/existing-pr-comment.md

      # =========================================================
      # STAGE 2 - CREATE BRANCH
      # =========================================================

      - name: Create Issue Branch
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true'
        run: |
          echo "Preparing branch ${BRANCH_NAME}..."

          git fetch origin main
          git fetch origin "${BRANCH_NAME}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH_NAME}"; then
            echo "Remote branch exists without an open PR. Resetting onto origin/main..."
            git checkout -B "${BRANCH_NAME}" origin/main
          else
            git checkout -b "${BRANCH_NAME}"
          fi

          echo "Using branch: ${BRANCH_NAME}"

      # =========================================================
      # STAGE 2 - RESOLVE ISSUE
      # =========================================================

      - name: Resolve Issue with Cursor
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/issue_triage/build_resolve_prompt.py

          echo "Starting Cursor implementation..."

          set +e

          cursor-agent \
            -p \
            --trust \
            --output-format text \
            "$(cat /tmp/resolve-prompt.txt)" \
            > /tmp/resolve-result.txt 2>&1

          CURSOR_EXIT_CODE=$?

          set -e

          echo "Cursor exit code: ${CURSOR_EXIT_CODE}"

          echo ""
          echo "========== CURSOR RESOLUTION =========="
          cat /tmp/resolve-result.txt
          echo "========================================"

          if [ "$CURSOR_EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "Cursor resolution failed."
            echo "No Pull Request will be created."
            exit 1
          fi

          if [ ! -s /tmp/resolve-result.txt ]; then
            echo ""
            echo "Cursor returned an empty resolution."
            exit 1
          fi

      # =========================================================
      # VERIFY TEST REPORT
      # =========================================================

      - name: Verify Test Report
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true'
        run: |
          bash .github/scripts/issue_triage/verify_test_report.sh /tmp/resolve-result.txt

      # =========================================================
      # CHECK ACTUAL CHANGES
      # =========================================================

      - name: Check Changes
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true'
        id: changes
        run: |
          echo "Checking actual repository changes..."

          git status --short

          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Cursor did not make any repository changes."
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Actual changes detected."

          git diff --stat

      # =========================================================
      # NO CHANGE
      # =========================================================

      - name: Comment - No Code Change Required
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat > /tmp/no-change-comment.md <<EOF
          ## 🤖 T3Planet AI Bot

          ### 🔍 Issue Analysis

          **Classification:** ✅ \`VALID_ISSUE\`

          ### ⚠️ No Code Change

          The issue was classified as valid, but Cursor did not make
          any repository changes.

          ### 📋 Analysis

          $(cat /tmp/resolve-result.txt)

          No Pull Request was created.
          EOF

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/no-change-comment.md

      # =========================================================
      # SHOW FINAL CHANGES
      # =========================================================

      - name: Review Changes
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        run: |
          echo "========================================"
          echo "FILES THAT WILL BE INCLUDED IN PR"
          echo "========================================"

          git status --short

          echo ""
          git diff --stat

          echo ""
          echo "========================================"
          echo "DIFF"
          echo "========================================"

          git diff

      # =========================================================
      # COMMIT
      # =========================================================

      - name: Commit Changes
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "Checking files to commit..."

          git status --short

          unexpected=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            status="${line:0:2}"
            path="${line:3}"
            path="${path#\"}"
            path="${path%\"}"

            if [ "$status" != "??" ]; then
              continue
            fi

            case "$path" in
              .DS_Store|*/.DS_Store|__pycache__|__pycache__/*|*/__pycache__/*|*.pyc)
                echo "Skipping generated file: ${path}"
                ;;
              .cursor|.cursor/*|node_modules|node_modules/*|.env|*.log|tmp|tmp/*)
                unexpected="${unexpected}${path}"$'\n'
                ;;
            esac
          done < <(git status --porcelain)

          if [ -n "$unexpected" ]; then
            echo "Unexpected untracked files were produced:"
            printf '%s' "$unexpected"

            cat > /tmp/unexpected-files-comment.md <<EOF
          ## 🤖 T3Planet AI Bot

          ### ⚠️ Unexpected Files

          The automated fix produced untracked files that should not be committed:

          \`\`\`
          ${unexpected}
          \`\`\`

          No Pull Request was created.
          EOF

            gh issue comment "$ISSUE_NUMBER" \
              --repo "${{ github.repository }}" \
              --body-file /tmp/unexpected-files-comment.md

            exit 1
          fi

          git add -u

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            status="${line:0:2}"
            path="${line:3}"
            path="${path#\"}"
            path="${path%\"}"

            if [ "$status" != "??" ]; then
              continue
            fi

            case "$path" in
              .DS_Store|*/.DS_Store|__pycache__|__pycache__/*|*/__pycache__/*|*.pyc)
                continue
                ;;
            esac

            git add -- "$path"
          done < <(git status --porcelain)

          echo "========================================"
          echo "FILES BEING COMMITTED"
          echo "========================================"

          git diff --cached --name-only

          git commit \
            -m "Fix issue #${{ github.event.issue.number }}"

      # =========================================================
      # PUSH
      # =========================================================

      - name: Push Issue Branch
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        run: |
          git push \
            --force-with-lease \
            --set-upstream origin "${BRANCH_NAME}"

      # =========================================================
      # CREATE DRAFT PR
      # =========================================================

      - name: Create Draft Pull Request
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python3 .github/scripts/issue_triage/format_pr_body.py

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body-file /tmp/pr-body.md \
            --draft)

          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"

          echo ""
          echo "Draft PR created:"
          echo "${PR_URL}"

      # =========================================================
      # COMMENT PR ON ISSUE
      # =========================================================

      - name: Comment Pull Request on Issue
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 .github/scripts/issue_triage/format_pr_issue_comment.py

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/pr-comment.md
